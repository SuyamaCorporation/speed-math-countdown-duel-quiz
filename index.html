<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スピード計算カウントダウンデュエルクイズ</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
<div class="max-w-lg mx-auto p-4 py-8">
  <h1 class="text-2xl font-bold text-center text-red-400 mb-1">⚡ スピード計算デュエル</h1>
  <p class="text-center text-gray-400 text-sm mb-6">60秒で何問解けるか？</p>

  <!-- スタート画面 -->
  <div id="startScreen" class="text-center">
    <div class="bg-gray-800 rounded-xl p-8 mb-6 border border-gray-700">
      <div class="text-6xl mb-4">🧮</div>
      <h2 class="text-xl font-bold mb-4">難易度を選択</h2>
      <div class="space-y-3">
        <button data-diff="easy"
          aria-label="イージー難易度を選択"
          class="diff-btn w-full py-4 rounded-xl font-bold text-lg bg-green-800 hover:bg-green-700 border-2 border-transparent transition-all">
          🟢 EASY（1〜10の四則演算）
        </button>
        <button data-diff="medium"
          aria-label="ミディアム難易度を選択"
          class="diff-btn w-full py-4 rounded-xl font-bold text-lg bg-yellow-800 hover:bg-yellow-700 border-2 border-transparent transition-all">
          🟡 MEDIUM（1〜50・掛け算含む）
        </button>
        <button data-diff="hard"
          aria-label="ハード難易度を選択"
          class="diff-btn w-full py-4 rounded-xl font-bold text-lg bg-red-800 hover:bg-red-700 border-2 border-transparent transition-all">
          🔴 HARD（1〜100・全演算・括弧あり）
        </button>
      </div>
    </div>
    <!-- 最高記録 -->
    <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
      <div class="text-sm text-gray-400 mb-2">最高記録</div>
      <div class="grid grid-cols-3 gap-2 text-sm">
        <div class="text-center"><div class="text-green-400 font-bold" id="bestEasy">-</div><div class="text-gray-500">EASY</div></div>
        <div class="text-center"><div class="text-yellow-400 font-bold" id="bestMedium">-</div><div class="text-gray-500">MEDIUM</div></div>
        <div class="text-center"><div class="text-red-400 font-bold" id="bestHard">-</div><div class="text-gray-500">HARD</div></div>
      </div>
    </div>
  </div>

  <!-- ゲーム画面 -->
  <div id="gameScreen" class="hidden">
    <!-- タイマーバー -->
    <div class="relative h-4 bg-gray-800 rounded-full overflow-hidden mb-4">
      <div id="timerBar" class="h-full bg-red-500 transition-all duration-1000" style="width:100%"></div>
    </div>
    <div class="flex justify-between items-center mb-6 text-sm">
      <span class="text-gray-400">残り <span id="timerDisplay" class="text-2xl font-bold text-white">60</span>秒</span>
      <span class="text-green-400 font-bold">✅ <span id="correctDisplay">0</span></span>
      <span class="text-red-400 font-bold">❌ <span id="wrongDisplay">0</span></span>
    </div>

    <!-- 問題 -->
    <div class="bg-gray-800 rounded-2xl p-8 mb-4 text-center border border-gray-700 shadow-xl">
      <div id="questionDisplay" class="text-4xl sm:text-5xl font-bold font-mono text-white mb-2"></div>
      <div class="text-gray-500 text-sm">= ?</div>
    </div>

    <!-- アニメーション結果 -->
    <div id="resultAnim" class="text-center text-3xl font-bold h-10 mb-2 transition-all duration-300"></div>

    <!-- 入力 -->
    <div class="flex gap-2">
      <input id="mathInput" type="number"
        aria-label="計算結果を入力"
        placeholder="答えを入力..."
        class="flex-1 bg-gray-700 border border-gray-600 rounded-xl px-4 py-4 text-2xl font-mono text-center focus:outline-none focus:border-red-500"
        autocomplete="off"
      />
      <button id="submitMath"
        aria-label="答えを送信"
        class="bg-red-600 hover:bg-red-500 px-6 py-4 rounded-xl font-bold text-xl transition-colors">
        →
      </button>
    </div>
  </div>

  <!-- 結果画面 -->
  <div id="resultScreen" class="hidden text-center">
    <div class="bg-gray-800 rounded-xl p-8 mb-6 border border-gray-700">
      <div id="resultEmoji" class="text-6xl mb-4"></div>
      <div class="text-2xl font-bold mb-2" id="resultTitle"></div>
      <div class="text-5xl font-bold text-white mb-1"><span id="resultCorrect"></span>問正解</div>
      <div id="newRecord" class="hidden text-yellow-400 font-bold text-lg mb-3">🏆 新記録！</div>
      <div class="grid grid-cols-2 gap-4 mt-4 text-sm">
        <div class="bg-gray-700 rounded-lg p-3">
          <div class="text-gray-400 mb-1">正答数</div>
          <div class="text-green-400 font-bold text-2xl" id="rCorrect"></div>
        </div>
        <div class="bg-gray-700 rounded-lg p-3">
          <div class="text-gray-400 mb-1">誤答数</div>
          <div class="text-red-400 font-bold text-2xl" id="rWrong"></div>
        </div>
        <div class="bg-gray-700 rounded-lg p-3">
          <div class="text-gray-400 mb-1">正答率</div>
          <div class="text-blue-400 font-bold text-2xl" id="rRate"></div>
        </div>
        <div class="bg-gray-700 rounded-lg p-3">
          <div class="text-gray-400 mb-1">難易度</div>
          <div class="text-purple-400 font-bold text-lg" id="rDiff"></div>
        </div>
      </div>
    </div>
    <div class="flex gap-3">
      <button id="retryBtn"
        aria-label="同じ難易度でリトライ"
        class="flex-1 bg-red-700 hover:bg-red-600 py-3 rounded-xl font-bold transition-colors">
        リトライ
      </button>
      <button id="menuBtn"
        aria-label="難易度選択に戻る"
        class="flex-1 bg-gray-700 hover:bg-gray-600 py-3 rounded-xl font-bold transition-colors">
        メニューへ
      </button>
    </div>
  </div>
</div>

<script>
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

const configs = {
  easy:   { max: 10,  ops: ['+', '-'],          label: 'EASY' },
  medium: { max: 50,  ops: ['+', '-', '*'],      label: 'MEDIUM' },
  hard:   { max: 100, ops: ['+', '-', '*', '/'], label: 'HARD' }
};

let diff = 'easy';
let timer = null;
let timeLeft = 60;
let correct = 0;
let wrong = 0;
let currentAnswer = 0;

function rand(max) { return Math.floor(Math.random() * max) + 1; }

function genQuestion(d) {
  const cfg = configs[d];
  const op = cfg.ops[Math.floor(Math.random() * cfg.ops.length)];
  let a, b, q, ans;
  if (op === '+') {
    a = rand(cfg.max); b = rand(cfg.max);
    q = `${a} + ${b}`; ans = a + b;
  } else if (op === '-') {
    a = rand(cfg.max); b = rand(cfg.max);
    if (a < b) [a, b] = [b, a];
    q = `${a} - ${b}`; ans = a - b;
  } else if (op === '*') {
    a = rand(Math.min(cfg.max, 12)); b = rand(Math.min(cfg.max, 12));
    q = `${a} × ${b}`; ans = a * b;
  } else {
    b = rand(12); ans = rand(Math.min(cfg.max, 20));
    a = b * ans;
    q = `${a} ÷ ${b}`;
  }
  return { q, ans };
}

function loadBest() {
  ['easy', 'medium', 'hard'].forEach(d => {
    const v = localStorage.getItem(`mathBest_${d}`);
    document.getElementById(`best${d.charAt(0).toUpperCase() + d.slice(1)}`).textContent = v ? `${v}問` : '-';
  });
}

function startGame(d) {
  diff = d;
  correct = 0; wrong = 0; timeLeft = 60;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
  document.getElementById('correctDisplay').textContent = 0;
  document.getElementById('wrongDisplay').textContent = 0;
  document.getElementById('timerDisplay').textContent = 60;
  document.getElementById('timerBar').style.width = '100%';
  document.getElementById('timerBar').className = 'h-full bg-red-500 transition-all duration-1000';
  nextQuestion();
  document.getElementById('mathInput').focus();

  timer = setInterval(() => {
    timeLeft--;
    document.getElementById('timerDisplay').textContent = timeLeft;
    document.getElementById('timerBar').style.width = (timeLeft / 60 * 100) + '%';
    if (timeLeft <= 15) {
      document.getElementById('timerBar').className = 'h-full bg-orange-500 transition-all duration-1000';
    }
    if (timeLeft <= 5) {
      document.getElementById('timerBar').className = 'h-full bg-yellow-500 transition-all duration-1000';
    }
    if (timeLeft <= 0) {
      clearInterval(timer);
      showResult();
    }
  }, 1000);
}

function nextQuestion() {
  const { q, ans } = genQuestion(diff);
  document.getElementById('questionDisplay').textContent = q;
  currentAnswer = ans;
  document.getElementById('mathInput').value = '';
}

function showAnim(ok) {
  const el = document.getElementById('resultAnim');
  el.textContent = ok ? '✅ 正解！' : '❌ 不正解';
  el.className = `text-center text-2xl font-bold h-10 mb-2 ${ok ? 'text-green-400' : 'text-red-400'}`;
  setTimeout(() => { el.textContent = ''; }, 500);
}

function submitAnswer() {
  const val = document.getElementById('mathInput').value.trim();
  if (val === '') return;
  const num = parseInt(val, 10);
  if (num === currentAnswer) {
    correct++;
    document.getElementById('correctDisplay').textContent = correct;
    showAnim(true);
  } else {
    wrong++;
    document.getElementById('wrongDisplay').textContent = wrong;
    showAnim(false);
  }
  nextQuestion();
  document.getElementById('mathInput').focus();
}

document.getElementById('submitMath').addEventListener('click', submitAnswer);
document.getElementById('mathInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') submitAnswer();
});

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => startGame(btn.dataset.diff));
});

function showResult() {
  clearInterval(timer);
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');

  const total = correct + wrong;
  const rate = total === 0 ? 0 : Math.round(correct / total * 100);
  document.getElementById('resultCorrect').textContent = correct;
  document.getElementById('rCorrect').textContent = correct;
  document.getElementById('rWrong').textContent = wrong;
  document.getElementById('rRate').textContent = rate + '%';
  document.getElementById('rDiff').textContent = configs[diff].label;

  const emojis = [[20,'🏆','神速計算！'], [15,'⚡','超高速！'], [10,'🔥','なかなか！'], [0,'👍','お疲れ様！']];
  for (const [min, emoji, title] of emojis) {
    if (correct >= min) {
      document.getElementById('resultEmoji').textContent = emoji;
      document.getElementById('resultTitle').textContent = title;
      break;
    }
  }

  const bestKey = `mathBest_${diff}`;
  const prev = parseInt(localStorage.getItem(bestKey) || '0');
  if (correct > prev) {
    localStorage.setItem(bestKey, correct);
    document.getElementById('newRecord').classList.remove('hidden');
  } else {
    document.getElementById('newRecord').classList.add('hidden');
  }
  loadBest();
}

document.getElementById('retryBtn').addEventListener('click', () => startGame(diff));
document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
});

loadBest();
</script>
</body>
</html>
